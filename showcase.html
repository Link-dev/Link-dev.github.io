---
layout: default
title: Showcase
navbar_title: Showcase
---

<header class="page-header">
    <h1>Showcase</h1>
    <p class="subtitle">Places I have been — through my lens.</p>
</header>

<div class="gallery">
    {% for item in site.data.gallery %}
    <a class="gallery-item" data-full="{{ item.image | relative_url }}">
        <img src="{{ item.image | relative_url }}" alt="{{ item.caption }}" loading="lazy">
        <span class="gallery-caption"><i class="fas fa-location-dot"></i> {{ item.caption }}</span>
    </a>
    {% endfor %}
</div>

<dialog class="lightbox" id="lightbox">
    <img alt="">
</dialog>

<script>
(function () {
    var dialog = document.getElementById('lightbox');
    var dialogImg = dialog.querySelector('img');
    document.querySelectorAll('.gallery-item').forEach(function (el) {
        el.addEventListener('click', function () {
            dialogImg.src = el.getAttribute('data-full');
            dialog.showModal();
        });
    });
    dialog.addEventListener('click', function () { dialog.close(); });
})();
</script>
