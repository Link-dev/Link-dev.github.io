<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }} · {{ site.data.profile.primary_name }}</title>
    <meta name="description" content="{{ site.data.profile.meta_description | default: site.data.profile.primary_name }}">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/etc/favicon.svg' | relative_url }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/etc/favicon-32.png' | relative_url }}">
    <link rel="apple-touch-icon" href="{{ '/assets/images/etc/favicon-180.png' | relative_url }}">

    <!-- Social sharing -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ page.title }} · {{ site.data.profile.primary_name }}">
    <meta property="og:description" content="{{ site.data.profile.meta_description | default: site.data.profile.primary_name }}">
    <meta property="og:image" content="{{ site.url }}{{ site.data.profile.portrait_url }}">
    <meta property="og:url" content="{{ site.url }}{{ page.url }}">
    <meta name="twitter:card" content="summary">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.1/css/academicons.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
    {% include navbar.html %}
    <main class="page">
        <div class="container">
            {{ content }}
        </div>
    </main>
    {% include footer.html %}
    <script src="{{ '/assets/js/semantic_scholar_citation_count.js' | relative_url }}"></script>
</body>
</html>
