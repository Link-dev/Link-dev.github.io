<nav class="site-nav">
    <div class="nav-inner">
        <a class="nav-brand" href="{{ '/' | relative_url }}">{{ site.data.profile.navbar_name }}</a>
        <div class="nav-links">
            {% for item in site.data.navigation.pages %}
            <a href="{{ item.url | relative_url }}" {% if item.name == page.navbar_title %}class="active"{% endif %}>{{ item.name }}</a>
            {% endfor %}
        </div>
    </div>
</nav>
